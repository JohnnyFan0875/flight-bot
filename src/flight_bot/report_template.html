<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
  --accent: #2f6fed; --accent-soft: #e8efff;
  --new-low: #12805c; --new-low-soft: #e3f5ee;
  --median: #2f6fed; --median-soft: #e8efff;
  --google: #a15c00; --google-soft: #fff1d6;
  --cap: #7a3fc4; --cap-soft: #f1e8fc;
  --down: #12805c; --up: #c4320a; --warn-bg: #fff4e5; --warn-line: #f5c27a;
  --series-out: #2a78d6; --series-back: #eb6834;
  --band-a: #eef3fc; --band-b: #fbf1e9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141a; --panel: #1a1e26; --text: #e7e9ee; --muted: #98a2b3; --line: #2b313c;
    --accent: #7aa2ff; --accent-soft: #1f2a44;
    --new-low: #4fd1a1; --new-low-soft: #143329;
    --median: #7aa2ff; --median-soft: #1f2a44;
    --google: #f2b84b; --google-soft: #3a2e14;
    --cap: #c39bff; --cap-soft: #2d2140;
    --down: #4fd1a1; --up: #ff8a65; --warn-bg: #3a2e14; --warn-line: #7a5b1f;
    --series-out: #3987e5; --series-back: #d95926;
    --band-a: #1c2433; --band-b: #2a221c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 0; }
header.top .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 17px; margin: 28px 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h2 small { font-size: 13px; color: var(--muted); font-weight: normal; }
.sub { color: var(--muted); font-size: 13px; }
select, button, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.notes { margin-top: 12px; display: grid; gap: 8px; }
.notes:empty { display: none; }
.note { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 12px; position: sticky; top: 0; z-index: 2; }
.filters select, .filters input { padding: 5px 8px; font-size: 14px; }
.filters input[type="number"] { width: 110px; }
[hidden] { display: none !important; }

/* 和前一次查詢比較的狀態：純文字 */
.s-new { color: var(--accent); font-weight: 600; }
.s-down { color: var(--down); font-weight: 600; }
.s-up { color: var(--up); font-weight: 600; }
.s-same { color: var(--muted); }

/* 手機：卡片 */
.cards { display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .price { font-size: 20px; font-weight: 700; white-space: nowrap; }
.card .price small { font-size: 13px; font-weight: 600; }
/* 第二行：起飛 → 抵達時間靠左、漲跌靠右；第三行：航班靠左、Google Flights 靠右 */
.card :is(.row2, .row3) { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; font-size: 13px; }
.card .row2 b { font-size: 14px; }
.card .row3 .info { color: var(--muted); min-width: 0; }
.card :is(.row2, .row3) > :last-child { white-space: nowrap; }
.nw { white-space: nowrap; }
.more { margin-top: 12px; padding: 8px; text-align: center; }
/* 出發地 ⇄ 目的地和查詢區間同一行 */
.f-row1 { display: flex; gap: 12px; align-items: center; flex-basis: 100%; min-width: 0; }

/* 單程航班：左去程、右回程 */
.split { display: grid; gap: 16px; }
.split > section { min-width: 0; }
.split h3 { font-size: 15px; margin: 4px 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* 排序、篩選、清除篩選三個一樣高 */
.split h3 .hctl { height: 32px; padding: 0 10px; font-size: 14px; font-weight: normal; line-height: 30px; }
.split h3 .sf-open.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.split h3 .sf-reset { margin-left: auto; }
.split h3 small { color: var(--muted); font-weight: normal; font-size: 13px; }

/* 篩選字卡 */
body.modal-open { overflow: hidden; }
.modal { position: fixed; inset: 0; z-index: 10; background: rgba(15, 20, 30, 0.45);
  display: flex; align-items: center; justify-content: center; padding: 12px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 460px;
  padding: 12px; display: grid; gap: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25); }
.sheet-head { display: flex; gap: 8px; align-items: center; }
.ftabs { display: flex; flex: 1; gap: 6px; }
.ftabs button { flex: 1; padding: 6px 8px; font-weight: 600; }
.ftabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sheet .close { width: 34px; height: 34px; padding: 0; flex-shrink: 0; }
.frow { display: flex; gap: 8px; align-items: center; }
.frow > * { flex: 1 1 0; min-width: 0; }
.sheet select, .sheet #fm-price, .ms-btn { height: 36px; padding: 0 8px; font-size: 14px; width: 100%; }
.ftime { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.sheet .ftime select { flex: 1; min-width: 0; padding: 0 4px; }
.frow.fend { justify-content: flex-end; }
.frow.fend > * { flex: 0 0 auto; }
#fm-count { margin-right: auto; }
/* 多選選單 */
.ms { position: relative; }
.ms-btn { display: flex; align-items: center; gap: 4px; text-align: left; }
.ms-btn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-btn::after { content: "▾"; color: var(--muted); font-size: 12px; }
.ms-list { position: absolute; left: 0; top: calc(100% + 4px); z-index: 3; min-width: 100%; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); }
.ms-list.up { top: auto; bottom: calc(100% + 4px); }
.ms-list label { display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.ms-list label:hover { background: var(--accent-soft); }
.ms-list input { margin: 0; padding: 0; }
.ms-list .grp { font-size: 12px; color: var(--muted); padding: 6px 10px 2px; }
.split th, .split td { padding: 8px 7px; font-size: 14px; }
.split th:first-child, .split td:first-child { padding-left: 14px; }
.split td.price { font-size: 15px; }
.split .table-wrap { overflow-x: auto; }
.split tbody tr, .split .card { cursor: pointer; }
.split tbody tr.sel, .split tbody tr.sel:hover { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.split .card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--text); }
th .arrow { color: var(--accent); }
.split h3 .unpick { font-size: 13px; padding: 1px 10px; border-radius: 6px; margin-left: auto; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
/* 日期選單靠右 */
header.top .wrap > div { flex: 1; }
.title-row #history { margin-left: auto; }
.title-row select { font-size: 15px; font-weight: 600; padding: 4px 8px; }
.title-row .sub { white-space: nowrap; }
.filters { margin-top: 12px; }
/* 點選一班時，對應的列之間的連結線 */
.split { position: relative; }
.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
/* 每一組配對一個顏色：點選的那班 → 第 N 班 → 第 N 組總額，同一條路線同色 */
.links path { fill: none; stroke: currentColor; stroke-width: 1.6; opacity: 0.75; }
.links circle { fill: currentColor; }
@media (min-width: 1100px) {
  .split { grid-template-columns: 1fr 1fr; }
  .split.picked { grid-template-columns: 1fr 1fr minmax(170px, 0.36fr); }
  .split.picked th, .split.picked td { padding: 8px 5px; }
  .split.picked th:first-child, .split.picked td:first-child { padding-left: 12px; }
  .seg, .picked-sum, .pair-total { display: none !important; }
}
@media (max-width: 1099px) {
  /* 出發地選單佔滿剩下的寬度（min-width: 0：不然選單的內容寬度會把這一行撐出框外），查詢區間固定一行 */
  .f-row1 #f-pair { flex: 1; min-width: 0; }
  .f-range { flex-shrink: 0; white-space: nowrap; }
}
/* 窄螢幕：上方分頁切換航班和折線圖；航班的去程、回程也分頁切換（按鈕或左右滑動），總額直接寫在另一邊的卡片上 */
.seg { display: flex; flex-basis: 100%; gap: 6px; }
.seg button { flex: 1; padding: 6px 8px; font-weight: 600; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg button small { font-weight: normal; opacity: 0.85; }
.page-tabs { margin-top: 12px; }
.picked-sum { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); border: 1px solid var(--accent);
  border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-size: 14px; }
.picked-sum .unpick { margin-left: auto; font-size: 13px; padding: 2px 10px; flex-shrink: 0; white-space: nowrap; }
.card .pair-total { margin-top: 4px; font-weight: 600; text-align: right; }
@media (max-width: 1099px) {
  .split[data-view="out"] #side-back, .split[data-view="back"] #side-out, #side-total { display: none; }
  main[data-page="flights"] #page-chart, main[data-page="chart"] #split, main[data-page="chart"] #tabs { display: none; }
  main[data-page="chart"] .chart-head { margin-top: 0; }
  /* 分頁已經寫了去程／回程和班數，標題列只留排序、篩選、清除篩選 */
  .split h3 { flex-wrap: nowrap; }
  .split h3 .lbl, .split h3 .count { display: none; }
}

/* 電腦：表格 */
.table-wrap { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 600; background: var(--panel); white-space: nowrap; }
tbody tr:hover { background: var(--accent-soft); }
td .line2 { color: var(--muted); font-size: 13px; }
td.price { font-size: 17px; font-weight: 700; white-space: nowrap; }
@media (min-width: 900px) {
  .table-wrap { display: block; }
  .cards { display: none; }
}

.scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
/* 每週最低單程價格：折線圖 */
.chart-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 28px 0 10px; }
.chart-head h2 { margin: 0; }
.chart-head .nav { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.chart-head .nav button { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 16px; line-height: 1; }
.chart-head .nav .which { font-weight: 600; min-width: 9em; text-align: center; }
.charts { display: grid; gap: 10px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 4px; }
.chart .title { font-size: 13px; color: var(--muted); }
.chart .title i { display: inline-block; width: 18px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
/* 同一個月份的週同一個底色，相鄰月份交替 */
.chart .band0 { fill: var(--band-a); }
.chart .band1 { fill: var(--band-b); }
.chart .band-label { fill: var(--muted); font-size: 12px; font-weight: 600; }
.chart .tick { fill: var(--muted); font-size: 12px; }
.chart .series path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .series circle.dot { stroke: var(--panel); stroke-width: 2; }
.chart .val { fill: var(--text); font-size: 12px; font-weight: 600; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + circle.dot, .chart circle.dot.on { r: 6; }
.chart .out path { stroke: var(--series-out); }
.chart .out circle.dot { fill: var(--series-out); }
.chart .back path { stroke: var(--series-back); }
.chart .back circle.dot { fill: var(--series-back); }
.grid2 > *, .cards > * { min-width: 0; }  /* 避免寬表格把 grid 撐出畫面 */
main { overflow-x: clip; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }
main.wrap { padding-bottom: 48px; }  /* .wrap 的 padding 會蓋掉單獨寫的 main，所以要寫在一起 */
/* 表格每一列的內容都從頂端開始：大小不同的文字和標籤統一行高、靠上 */
td { line-height: 1.45; }
td .line2 { vertical-align: top; }
td.price { line-height: 1.3; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <div class="title-row">
        <h1>機票總覽</h1>
        <select id="history" aria-label="報告日期"></select>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main" data-page="flights">
  <div class="notes" id="notes"></div>
  <div class="seg page-tabs" id="page-tabs">
    <button type="button" data-page="flights">去程・回程</button>
    <button type="button" data-page="chart">每週最低單程價格</button>
  </div>
  <div class="filters">
    <div class="f-row1">
      <select id="f-pair" aria-label="出發地與目的地"></select>
      <div class="sub f-range" id="range"></div>
    </div>
    <div class="seg tabs" id="tabs">
      <button type="button" data-view="out">去程 <small></small></button>
      <button type="button" data-view="back">回程 <small></small></button>
    </div>
  </div>
  <!-- 單程航班：左去程、右回程，各自排序和分頁 -->
  <div class="split" id="split" data-view="out">
    <section id="side-out"></section>
    <section id="side-back"></section>
    <section id="side-total" hidden></section>
    <svg class="links" id="links" aria-hidden="true"></svg>
  </div>

  <div id="page-chart">
    <div class="chart-head">
      <h2>每週最低單程價格</h2>
      <div class="nav" id="chart-nav">
        <button type="button" id="chart-prev" aria-label="上一組機場">‹</button>
        <span class="which" id="chart-which"></span>
        <button type="button" id="chart-next" aria-label="下一組機場">›</button>
      </div>
    </div>
    <div class="charts">
      <div class="chart" id="chart-out"></div>
      <div class="chart" id="chart-back"></div>
    </div>
  </div>

</main>

<!-- 篩選字卡：去程、回程各自的篩選 -->
<div class="modal" id="fmodal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="篩選">
    <div class="sheet-head">
      <div class="ftabs" id="ftabs">
        <button type="button" data-side="out">去程</button>
        <button type="button" data-side="back">回程</button>
      </div>
      <button type="button" class="close" id="fm-close" aria-label="關閉">✕</button>
    </div>
    <div class="frow">
      <select id="fm-month" aria-label="出發月份"></select>
      <div class="ms" id="fm-wd"></div>
    </div>
    <div class="frow">
      <select id="fm-day" aria-label="天數"></select>
      <select id="fm-stops" aria-label="直飛或轉機"></select>
    </div>
    <div class="frow">
      <div class="ms" id="fm-q"></div>
      <span class="ftime">起飛
        <select id="fm-from" aria-label="最早起飛時間"></select>～<select id="fm-to" aria-label="最晚起飛時間"></select>
      </span>
    </div>
    <div class="frow">
      <input id="fm-price" type="number" inputmode="numeric" min="0" step="500" placeholder="金額上限" aria-label="單程金額上限">
      <select id="fm-status" aria-label="狀態"></select>
    </div>
    <div class="frow fend">
      <span class="muted small" id="fm-count"></span>
      <button type="button" id="fm-reset">清除篩選</button>
    </div>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => n == null ? "—" : "TWD " + Number(n).toLocaleString("en-US");
  const num = (n) => n == null ? "—" : Number(n).toLocaleString("en-US");
  const ymd = (iso) => iso.replaceAll("-", "/");
  const md = (iso) => { const [, m, d] = iso.split("-"); return `${+m}/${+d}`; };
  const dur = (m) => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
  const monthLabel = (ym) => `${ym.slice(0, 4)} 年 ${+ym.slice(5)} 月`;
  const place = (code) => D.airports[code] || code;
  const addDays = (iso, n) => { const t = new Date(iso + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  // 那一週的星期一
  const weekOf = (iso) => addDays(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
  const R = D.routes;
  const LEGS = D.legs;
  LEGS.forEach((l) => {
    l.month = l.date.slice(0, 7);
    l.week = weekOf(l.date);
    l.tw = l.out ? l.o : l.d;  // 台灣那一端
    l.jp = l.out ? l.d : l.o;  // 日本那一端
  });

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("fb2:" + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("fb2:" + k, JSON.stringify(v)); } catch (e) { /* 無痕模式等情況 */ } },
  };
  const PAGE = 10;
  const SORT0 = { key: "price", dir: 1 };
  // 上方只剩出發地 ⇄ 目的地，兩邊共用
  const state = { pair: "" };
  { const v = (store.get("filters") || {}).pair; if (typeof v === "string") state.pair = v; }
  // 單程航班兩個表格各自的排序；不記住，每次打開都從價格遞增開始
  const sides = { out: { sort: { ...SORT0 }, shown: PAGE }, back: { sort: { ...SORT0 }, shown: PAGE } };
  // 去程、回程各自的篩選（篩選字卡）；wd 星期、q 航班或航空公司是多選
  const SIDE0 = { month: "", wd: [], day: "", stops: "", q: [], from: "", to: "", price: "", status: "" };
  const WD = ["一", "二", "三", "四", "五", "六", "日"];
  // 起飛時間的選項：每個整點
  const HOURS = Array.from({ length: 24 }, (_, h) => `${String(h).padStart(2, "0")}:00`);
  ["out", "back"].forEach((k) => {
    const saved = (store.get("side-filters2") || {})[k] || {};
    sides[k].filter = { ...SIDE0, wd: [], q: [] };
    Object.keys(SIDE0).forEach((f) => {
      const v = saved[f];
      if (Array.isArray(SIDE0[f])) { if (Array.isArray(v)) sides[k].filter[f] = v.filter((x) => typeof x === "string"); }
      else if (typeof v === "string" && (!["from", "to"].includes(f) || HOURS.includes(v))) sides[k].filter[f] = v;
    });
  });
  const saveSides = () => store.set("side-filters2", { out: sides.out.filter, back: sides.back.filter });

  // ---------- 標頭與提示 ----------
  const r = D.run;
  // 標題右邊的日期選單：切換到那一天的報告
  const hist = $("history");
  (D.history.length ? D.history : [r.date]).slice().reverse().forEach((d) => {
    const o = document.createElement("option");
    o.value = d; o.textContent = ymd(d);
    if (d === r.date) o.selected = true;
    hist.appendChild(o);
  });
  hist.addEventListener("change", () => { location.href = `${D.base}d/${hist.value}.html`; });
  // 報告裡的日期清單是產生當天的；網站上的 dates.json 每天更新，讀得到就改用它（本機直接開檔案時讀不到，沿用內建的）
  fetch(`${D.base}dates.json`, { cache: "no-store" })
    .then((res) => res.ok ? res.json() : null)
    .then((dates) => {
      if (!Array.isArray(dates) || !dates.length) return;
      hist.innerHTML = "";
      [...new Set([...dates, r.date])].sort().reverse().forEach((d) => {
        const o = document.createElement("option");
        o.value = d; o.textContent = ymd(d);
        if (d === r.date) o.selected = true;
        hist.appendChild(o);
      });
    })
    .catch(() => {});

  const notes = [];
  (r.warnings || []).forEach((w) => notes.push("異常：" + w));
  $("notes").innerHTML = notes.map((n) => `<div class="note">${esc(n)}</div>`).join("");

  // ---------- 篩選選項 ----------
  const uniq = (xs) => [...new Set(xs)];
  const opts = (all, pairs) => `<option value="">${all}</option>` + pairs.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  // 折線圖的每一週：從最早到最晚連續列出，沒有資料的週斷開
  const weeks = [];
  if (LEGS.length) {
    const last = LEGS.map((l) => l.week).sort().pop();
    for (let w = LEGS.map((l) => l.week).sort()[0]; w <= last; w = addDays(w, 7)) weeks.push(w);
  }
  // 出發地 ⇄ 目的地：各航線所有可能的組合，值是「台灣機場|日本機場」
  const pairs = uniq(R.flatMap((x) => x.origins.flatMap((o) => x.dests.map((d) => `${o}|${d}`))));
  const allDays = uniq(R.flatMap((x) => x.days)).sort((a, b) => a - b);
  // 這次查詢的日期區間：最早的去程日（今天以前不查）到最晚的回程日；日期都過了的航線不算。
  // 選了出發地 ⇄ 目的地時只看有這組機場的航線
  const lastDay = (x) => addDays(x.range[1], Math.max(...x.days) - 1);
  function renderRange() {
    const [tw, jp] = state.pair ? state.pair.split("|") : [null, null];
    const active = R.filter((x) => lastDay(x) >= r.date && (!tw || (x.origins.includes(tw) && x.dests.includes(jp))));
    const rangeStart = active.map((x) => x.range[0]).sort()[0];
    const rangeEnd = active.map(lastDay).sort().pop();
    $("range").innerHTML = active.length
      ? `<span>查詢區間</span> <span class="nw">${ymd(rangeStart > r.date ? rangeStart : r.date)} – ${ymd(rangeEnd)}</span>` : "沒有要查的日期";
  }
  const PAIR_CHOICES = pairs.map((v) => {
    const [o, d] = v.split("|");
    return [v, `${place(o)} ${o} ⇄ ${place(d)} ${d}`];
  });
  const STATUS_CHOICES = [["new", "新出現"], ["down", "降價"], ["changed", "新出現或降價"], ["same", "持平"], ["up", "漲價"]];
  $("f-pair").addEventListener("change", () => { state.pair = $("f-pair").value; update(); });

  // ---------- 篩選 ----------
  const selectedPair = () => state.pair ? state.pair.split("|") : [null, null];  // [台灣機場, 日本機場]
  const fOf = (out) => sides[out ? "out" : "back"].filter;
  const legIndex = new Map(LEGS.map((l) => [`${l.r}|${l.o}|${l.d}|${l.date}`, l]));
  // 沒選天數 = 各航線自己設定的天數；選了就只用這個天數（航線沒設定這個天數就不配對）
  const daysFor = (route, day) => day ? (route.days.includes(+day) ? [+day] : []) : route.days;
  // 天數含去程當天：7 天 = 週三去、下週二回，回程日是去程日 + 6
  const tripEnd = (iso, n, out) => addDays(iso, out ? n - 1 : 1 - n);
  const stopsOk = (st, f) => !st || (st === "direct" ? f.stops === 0 : f.stops > 0);
  const statusOk = (st, want) => want === "changed" ? st === "new" || st === "down" : st === want;
  // 一邊的篩選：出發月份、星期看日期；其他看航班。航班或航空公司選了多個時，符合其中一個就列出
  const legOk = (F, l) => (!F.month || l.month === F.month) && (!F.wd.length || F.wd.includes(l.dow));
  const flightOk = (F, f) => stopsOk(F.stops, f)
    && (!F.q.length || F.q.some((v) => f.al.includes(v) || f.nos.includes(v)))
    && (!F.from || f.dep >= F.from) && (!F.to || f.dep <= F.to)
    && (!Number(F.price) || f.price <= Number(F.price))
    && (!F.status || statusOk(f.st, F.status));
  // 篩選了幾項（篩選按鈕上的數字）
  const activeCount = (F) => Object.keys(SIDE0).filter((k) => Array.isArray(F[k]) ? F[k].length : F[k]).length;

  // ---------- 狀態 ----------
  function statusText(f) {
    if (f.st === "new") return `<span class="s-new">新出現</span>`;
    if (f.st === "down") return `<span class="s-down">降 ${num(f.prev - f.price)}</span>`;
    if (f.st === "up") return `<span class="s-up">漲 ${num(f.price - f.prev)}</span>`;
    return `<span class="s-same">持平</span>`;
  }

  // ---------- 單程航班：左去程、右回程 ----------
  // 這一程在這一邊選的天數內，配不配得到符合另一邊篩選的航班
  function hasPartner(l) {
    const route = R[l.r];
    const [tw] = selectedPair();
    const P = fOf(!l.out);
    return daysFor(route, fOf(l.out).day).some((n) => {
      const day = tripEnd(l.date, n, l.out);
      return route.origins.some((o) => {
        if (tw && o !== tw) return false;
        const p = legIndex.get(l.out ? `${l.r}|${l.d}|${o}|${day}` : `${l.r}|${o}|${l.o}|${day}`);
        return p && legOk(P, p) && p.flights.some((f) => flightOk(P, f));
      });
    });
  }
  const FLIGHT_COMPARE = {
    pair: (a, b) => `${a.l.o}${a.l.d}`.localeCompare(`${b.l.o}${b.l.d}`),
    date: (a, b) => a.l.date.localeCompare(b.l.date) || a.f.dep.localeCompare(b.f.dep),
    price: (a, b) => a.f.price - b.f.price,
    flight: (a, b) => a.f.dep.localeCompare(b.f.dep),
  };
  const rowKey = (l, f) => `${l.o}|${l.d}|${l.date}|${f.nos.join(" ")}|${f.dep}`;
  // 點選的航班：{ out, items: [{ l, f }] }，都在同一邊；另一邊的表格只列出能和它們配對的航班。
  // 點表格的一列選一班；點折線圖的點選那一週所有並列最低價的航班。
  let picked = null;
  const pickedKeys = () => new Set(picked.items.map(({ l, f }) => rowKey(l, f)));
  // 和點選的航班配得到的另一程：{ "出發|抵達|日期": [點選航班的索引, ...] }，依各自的航線、另一邊選的天數、機場篩選算出
  function pickedPartners() {
    const [tw] = selectedPair();
    const map = new Map();
    const day = fOf(!picked.out).day;
    picked.items.forEach(({ l }, p) => {
      const route = R[l.r];
      daysFor(route, day).forEach((n) => {
        const day = tripEnd(l.date, n, picked.out);
        route.origins.forEach((o) => {
          if (tw && o !== tw) return;
          const key = picked.out ? `${l.d}|${o}|${day}` : `${o}|${l.o}|${day}`;
          if (!map.has(key)) map.set(key, []);
          if (!map.get(key).includes(p)) map.get(key).push(p);
        });
      });
    });
    return map;
  }
  // limit：找到這麼多班就停（只想知道有沒有的時候用 1）；nopick：不管點選的航班，只看篩選條件
  function filteredFlights(out, { limit = Infinity, nopick = false } = {}) {
    const list = [];
    const seen = new Set();
    const [tw, jp] = selectedPair();
    const only = !nopick && picked && picked.out !== out ? pickedPartners() : null;
    const F = fOf(out);
    for (const l of LEGS) {
      if (l.out !== out || (tw && (l.tw !== tw || l.jp !== jp)) || !legOk(F, l)) continue;
      const withs = only ? only.get(`${l.o}|${l.d}|${l.date}`) : null;
      if (only && !withs) continue;
      const fs = l.flights.filter((f) => flightOk(F, f));
      // 沒有點選時，只列出配得到另一程的
      if (!fs.length || (!withs && !hasPartner(l))) continue;
      for (const f of fs) {
        const key = rowKey(l, f);
        if (seen.has(key)) continue;  // 多條航線共用的航班只列一次
        seen.add(key);
        list.push({ l, f, k: l.flights.indexOf(f), withs });
        if (list.length >= limit) return list;
      }
    }
    const { key, dir } = sides[out ? "out" : "back"].sort;
    const cmp = FLIGHT_COMPARE[key] || FLIGHT_COMPARE.price;
    return list.sort((a, b) => cmp(a, b) * dir || a.f.price - b.f.price || a.l.date.localeCompare(b.l.date));
  }

  // ---------- 篩選選項：只列出配合其他篩選條件還找得到航班的選項（目前選的值一定列出） ----------
  const anyFlight = () => [true, false].some((out) => filteredFlights(out, { limit: 1, nopick: true }).length > 0);
  function withPair(pair, fn) {
    const saved = state.pair;
    state.pair = pair;
    try { return fn(); } finally { state.pair = saved; }
  }
  // 暫時改掉一邊的某個篩選，算出那時列得出的航班
  function withSide(k, patch, fn) {
    const saved = sides[k].filter;
    sides[k].filter = { ...saved, ...patch };
    try { return fn(); } finally { sides[k].filter = saved; }
  }
  // 拿掉自己這一項篩選後還列得出的航班；點選了另一邊的航班時，只算配得到的
  const facet = (k, key) => withSide(k, { [key]: SIDE0[key] }, () => filteredFlights(k === "out"));
  // 起飛時間：最早的選項到最晚的選項涵蓋這一邊所有航班（自己的最早／最晚不算進篩選）
  const floorHour = (t) => `${t.slice(0, 2)}:00`;
  const ceilHour = (t) => t.endsWith(":00") ? t : `${String(+t.slice(0, 2) + 1).padStart(2, "0")}:00`;
  function hourChoices(k, key) {
    const deps = facet(k, key).map(({ f }) => f.dep).sort();
    if (!deps.length) return [];
    const round = key === "from" ? floorHour : ceilHour;
    const lo = round(deps[0]), hi = round(deps[deps.length - 1]);
    return HOURS.filter((h) => h >= lo && h <= hi);
  }
  const keep = (cur) => (v) => v === cur || (Array.isArray(cur) && cur.includes(v));
  // 篩選字卡裡目前分頁那一邊的選項
  function sideChoices(k) {
    const F = sides[k].filter, out = k === "out";
    const has = (key, test) => { const rows = facet(k, key); return (v) => keep(F[key])(v) || rows.some((row) => test(row, v)); };
    const monthHas = has("month", ({ l }, v) => l.month === v);
    const wdHas = has("wd", ({ l }, v) => l.dow === v);
    const stopsHas = has("stops", ({ f }, v) => stopsOk(v, f));
    const statusHas = has("status", ({ f }, v) => statusOk(f.st, v));
    const qRows = facet(k, "q");
    const al = uniq(qRows.flatMap(({ f }) => f.al).concat(F.q.filter((v) => !/\d/.test(v)))).sort();
    const nos = uniq(qRows.flatMap(({ f }) => f.nos).concat(F.q.filter((v) => /\d/.test(v)))).sort();
    return {
      month: uniq(LEGS.filter((l) => l.out === out).map((l) => l.month)).sort().filter(monthHas).map((m) => [m, monthLabel(m)]),
      wd: WD.filter(wdHas).map((d) => [d, `星期${d}`]),
      day: allDays.map(String).filter((n) => n === F.day || withSide(k, { day: n }, () => filteredFlights(out, { limit: 1 }).length))
        .map((n) => [n, `${n} 天`]),
      stops: [["direct", "直飛"], ["connect", "轉機"]].filter(([v]) => stopsHas(v)),
      q: [al, nos],
      from: hourChoices(k, "from"),
      to: hourChoices(k, "to"),
      status: STATUS_CHOICES.filter(([v]) => statusHas(v)),
    };
  }
  function refreshPairs() {
    const ok = PAIR_CHOICES.filter(([v]) => v === state.pair || withPair(v, anyFlight));
    $("f-pair").innerHTML = opts("全部出發地 ⇄ 目的地", ok);
    $("f-pair").value = state.pair;
  }

  // ---------- 篩選字卡 ----------
  let fside = "out";  // 字卡目前的分頁
  // 多選選單：按鈕顯示選了什麼，點開是勾選清單
  function renderMulti(id, all, groups, cur, short) {
    const el = $(id);
    const prev = el.querySelector(".ms-list"), open = prev && !prev.hidden;
    const list = groups.map(([title, items]) => items.length
      ? (title ? `<div class="grp">${title}</div>` : "") + items.map(([v, t]) =>
        `<label><input type="checkbox" value="${esc(v)}"${cur.includes(v) ? " checked" : ""}> ${esc(t)}</label>`).join("") : "").join("");
    el.innerHTML = `<button type="button" class="ms-btn" aria-label="${all}"><span>${cur.length ? esc(short(cur)) : all}</span></button>
      <div class="ms-list${open && prev.classList.contains("up") ? " up" : ""}"${open ? ` style="${prev.getAttribute("style")}"` : " hidden"}>${list || `<div class="grp">沒有選項</div>`}</div>`;
  }
  function refreshModal() {
    if ($("fmodal").hidden) return;
    const F = sides[fside].filter, C = sideChoices(fside);
    $("ftabs").querySelectorAll("button").forEach((b) => {
      const n = activeCount(sides[b.dataset.side].filter);
      b.classList.toggle("on", b.dataset.side === fside);
      b.textContent = (b.dataset.side === "out" ? "去程" : "回程") + (n ? ` (${n})` : "");
    });
    const sel = (id, all, choices, cur) => { $(id).innerHTML = opts(all, choices); $(id).value = cur; };
    sel("fm-month", "全部出發月份", C.month, F.month);
    sel("fm-day", "全部天數", C.day, F.day);
    sel("fm-stops", "直飛和轉機", C.stops, F.stops);
    sel("fm-status", "全部狀態", C.status, F.status);
    [["from", "最早"], ["to", "最晚"]].forEach(([key, all]) => {
      const hours = C[key];
      if (F[key] && !hours.includes(F[key])) hours.push(F[key]);
      sel(`fm-${key}`, all, hours.sort().map((h) => [h, h]), F[key]);
    });
    if ($("fm-price").value !== F.price) $("fm-price").value = F.price;
    const wd = WD.filter((d) => F.wd.includes(d));
    renderMulti("fm-wd", "全部星期", [["", C.wd]], wd, () => `星期${wd.join("、")}`);
    renderMulti("fm-q", "全部航班和航空公司", [["航空公司", C.q[0].map((v) => [v, v])], ["航班", C.q[1].map((v) => [v, v])]],
      F.q, (q) => q.join("、"));
    $("fm-count").textContent = `符合 ${num(filteredFlights(fside === "out").length)} 班`;
  }
  // 一邊的篩選改了：兩邊都要重算（另一邊只列配得到的航班）
  function sideChanged() {
    sides.out.shown = PAGE;
    sides.back.shown = PAGE;
    saveSides();
    refreshPairs();
    refreshModal();
    renderSides();
    renderChart();
  }
  function setField(key, v) {
    sides[fside].filter = { ...sides[fside].filter, [key]: v };
    sideChanged();
  }
  [["fm-month", "month"], ["fm-day", "day"], ["fm-stops", "stops"], ["fm-status", "status"], ["fm-from", "from"], ["fm-to", "to"]]
    .forEach(([id, key]) => $(id).addEventListener("change", (e) => setField(key, e.target.value)));
  $("fm-price").addEventListener("input", (e) => setField("price", e.target.value));
  [["fm-wd", "wd"], ["fm-q", "q"]].forEach(([id, key]) => {
    const el = $(id);
    el.addEventListener("click", (e) => {
      if (!e.target.closest(".ms-btn")) return;
      const list = el.querySelector(".ms-list");
      document.querySelectorAll(".ms-list").forEach((x) => { if (x !== list) x.hidden = true; });
      list.hidden = !list.hidden;
      if (list.hidden) return;
      // 清單放得下就往下開，下面太擠就往上開，高度不超出畫面
      const b = el.getBoundingClientRect(), below = innerHeight - b.bottom - 16, above = b.top - 16;
      const up = below < 200 && above > below;
      list.classList.toggle("up", up);
      list.style.maxHeight = `${Math.min(300, up ? above : below)}px`;
    });
    el.addEventListener("change", () => setField(key, [...el.querySelectorAll("input:checked")].map((x) => x.value)));
  });
  // 點清單外面收起清單
  $("fmodal").addEventListener("click", (e) => {
    if (!e.target.closest(".ms")) document.querySelectorAll(".ms-list").forEach((x) => { x.hidden = true; });
    if (e.target === $("fmodal")) closeFilters();
  });
  $("ftabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { fside = b.dataset.side; refreshModal(); }));
  $("fm-reset").addEventListener("click", () => resetSide(fside));
  $("fm-close").addEventListener("click", () => closeFilters());
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("fmodal").hidden) closeFilters(); });
  function openFilters(k) {
    fside = k;
    $("fmodal").hidden = false;
    document.body.classList.add("modal-open");
    refreshModal();
  }
  function closeFilters() {
    $("fmodal").hidden = true;
    document.body.classList.remove("modal-open");
    document.querySelectorAll(".ms-list").forEach((x) => { x.hidden = true; });
  }
  function resetSide(k) {
    sides[k].filter = { ...SIDE0, wd: [], q: [] };
    sideChanged();
  }

  const FLIGHT_COLS = [["pair", "出發-抵達"], ["date", "日期"], ["price", "價格"], ["flight", "航班"]];
  const flightLine = (f) => `${esc(f.nos.join(" "))} ${esc(f.al.join("、"))} ・ ${dur(f.dur)}`;
  function renderSide(out) {
    const side = sides[out ? "out" : "back"];
    const mine = picked && picked.out === out;
    // 點選的那一邊只顯示點選的航班
    const list = mine ? picked.items.map(({ l, f }) => ({ l, f, k: l.flights.indexOf(f) })) : filteredFlights(out);
    const rows = mine ? list : list.slice(0, side.shown);
    const sel = mine ? pickedKeys() : new Set();
    const head = FLIGHT_COLS.map(([k, t]) => `<th data-sort="${k}">${t}${side.sort.key === k ? `<span class="arrow"> ${side.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("");
    const body = rows.map((row, i) => {
      const { l, f, k } = row;
      const arr = f.arr + (f.off ? `+${f.off}` : "");
      const pi = picked && !mine ? pairInfo(row) : null;
      return `<tr data-i="${i}"${sel.has(rowKey(l, f)) ? ' class="sel"' : ""}>
        <td class="nw"><b>${l.o}→${l.d}</b></td>
        <td class="nw" title="${l.date.slice(0, 4)}"><b>${md(l.date)}（${l.dow}）</b><div class="line2"><a href="${esc(l.url)}" target="_blank" rel="noopener">Google Flights</a></div></td>
        <td class="price num" title="${k === 0 ? "當天最低" : `當天第 ${k + 1} 低`}">${money(f.price)}<div class="line2 nw">${statusText(f)}</div>${pi ? `<div class="line2 nw pair-total">來回 ${money(pi.total)}（${pi.days.join("、")} 天）</div>` : ""}</td>
        <td><div class="nw"><b>${f.dep} → ${arr}</b></div><div class="line2 nw">${flightLine(f)}</div></td>
      </tr>`;
    }).join("");
    const cards = rows.map((row, i) => {
      const { l, f } = row;
      const arr = f.arr + (f.off ? `+${f.off}` : "");
      const pi = picked && !mine ? pairInfo(row) : null;
      return `<div class="card${sel.has(rowKey(l, f)) ? " sel" : ""}" data-i="${i}">
        <div class="row1"><b>${l.o}→${l.d} ${ymd(l.date)}(${l.dow})</b><span class="price num"><small>TWD</small> ${num(f.price)}</span></div>
        <div class="row2"><b class="num">${f.dep} → ${arr}</b>${statusText(f)}</div>
        <div class="row3"><span class="info">${esc(f.nos.join(" "))} ${esc(f.al.join("、"))}</span>
          <a href="${esc(l.url)}" target="_blank" rel="noopener">Google Flights</a></div>
        ${pi ? `<div class="pair-total num">來回 ${money(pi.total)} ・ ${pi.days.join("、")} 天</div>` : ""}
      </div>`;
    }).join("");
    const msg = LEGS.length ? "沒有符合篩選條件的航班" : "還沒有任何航班資料";
    const rest = list.length - rows.length;
    const sec = $(out ? "side-out" : "side-back");
    sec.querySelector(".count").textContent = `${num(list.length)} 班`;
    // 點選的那一邊只列點選的航班，篩選暫時不作用：只留取消選擇
    sec.querySelector(".unpick").hidden = !mine;
    sec.querySelectorAll(".hctl").forEach((x) => { x.hidden = mine; });
    const n = activeCount(side.filter);
    sec.querySelector(".sf-open").textContent = n ? `篩選 (${n})` : "篩選";
    sec.querySelector(".sf-open").classList.toggle("on", n > 0);
    // 點表格標題換成其他排序時，選單顯示「排序」
    const sv = `${side.sort.key}:${side.sort.dir}`;
    sec.querySelector(".sf-sort").value = SORTS.some(([v]) => v === sv) ? sv : "";
    $("tabs").querySelector(`[data-view="${out ? "out" : "back"}"] small`).textContent = mine ? "已選" : `${num(list.length)} 班`;
    const el = sec.querySelector(".side-body");
    // 窄螢幕看不到點選的那一邊，所以在另一邊頂端列出點選的航班
    const items = picked && !mine ? picked.items : [];
    const sum = items.length ? `<div class="picked-sum"><span>已選${picked.out ? "去程" : "回程"} ${items.length > 2
      ? `${items.length} 班 ${money(items[0].f.price)}`
      : items.map(({ l, f }) => `<b>${l.o}→${l.d} ${md(l.date)}（${l.dow}）${f.dep}</b> ${money(f.price)}`).join("、")}</span>
      <button type="button" class="unpick">取消</button></div>` : "";
    el.innerHTML = `${sum}${list.length ? `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
        <div class="cards">${cards}</div>` : `<div class="empty">${msg}</div>`}
      ${rest > 0 ? `<div class="more muted small">載入更多…</div>` : ""}`;
    el.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => {
      const k = th.dataset.sort;
      side.sort = { key: k, dir: side.sort.key === k ? -side.sort.dir : 1 };
      side.shown = PAGE;
      renderSides();
    }));
    // 點一下選取、再點一次取消（選了多班時，點其中一班就只留那一班）；另一邊重新篩選
    el.querySelectorAll("[data-i]").forEach((row) => row.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const { l, f } = rows[+row.dataset.i];
      const only = mine && picked.items.length === 1;
      picked = only ? null : { out, items: [{ l, f }] };
      sides[out ? "back" : "out"].shown = PAGE;
      if (picked) setView(!out);
      renderSides();
      renderChart();
    }));
    el.querySelector(".picked-sum .unpick")?.addEventListener("click", unpick);
    // 捲到列表底部附近就自動多列一頁；隱藏的那一邊不會觸發
    side.io?.disconnect();
    const more = el.querySelector(".more");
    if (more) {
      side.io = new IntersectionObserver((entries) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        side.io.disconnect();
        side.shown += PAGE;
        renderSides();
      }, { rootMargin: "400px 0px" });
      side.io.observe(more);
    }
    return rows;
  }

  // 窄螢幕一次只顯示一邊：分頁按鈕或左右滑動切換；點選一班後自動切到另一邊
  const narrow = () => !matchMedia("(min-width: 1100px)").matches;
  // iOS 在字小於 16px 的輸入框、選單聚焦時會自動放大頁面。iOS 上加 maximum-scale=1 只停用這個自動放大，
  // 雙指縮放仍然可以用；其他平台沒有這個問題，不加（Android 加了會不能縮放）
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
    document.querySelector('meta[name="viewport"]').content = "width=device-width, initial-scale=1, maximum-scale=1";
  }
  function setView(out, scroll = true) {
    const v = out ? "out" : "back";
    $("split").dataset.view = v;
    $("tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
    if (!scroll || !narrow()) return;
    // 已經往下捲過列表開頭時，捲回列表開頭（篩選列是 sticky，要讓開它的高度）
    requestAnimationFrame(() => {
      const gap = $("split").getBoundingClientRect().top - document.querySelector(".filters").offsetHeight - 8;
      if (gap < 0) scrollTo({ top: scrollY + gap, behavior: "smooth" });
    });
  }
  $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view === "out")));
  let touch = null;
  $("split").addEventListener("touchstart", (e) => {
    // 可橫向捲動的表格、輸入框裡的滑動不算
    touch = e.touches.length === 1 && !e.target.closest(".table-wrap, input, select")
      ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
  }, { passive: true });
  $("split").addEventListener("touchend", (e) => {
    if (!touch || !narrow()) return;
    const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setView(dx > 0);  // 往右滑回到去程
  }, { passive: true });
  setView(true, false);
  // 窄螢幕上方的分頁：航班或每週最低單程價格
  function setPage(p) {
    $("main").dataset.page = p;
    $("page-tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.page === p));
    if (p === "chart") renderChart();  // 隱藏時量不到寬度，切過來再畫一次
  }
  $("page-tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => setPage(b.dataset.page)));
  setPage("flights");

  // 取消選擇：窄螢幕回到點選的那一邊
  function unpick() {
    if (!picked) return;
    const out = picked.out;
    picked = null;
    setView(out);
    renderSides();
    renderChart();
  }
  // 兩邊的標題列：只建立一次。排序選單和表格標題的排序是同一個設定
  const SORTS = [["date:1", "日期早→晚"], ["date:-1", "日期晚→早"], ["price:1", "金額低→高"], ["price:-1", "金額高→低"]];
  ["out", "back"].forEach((k) => {
    const sec = $(`side-${k}`);
    const label = k === "out" ? "去程" : "回程";
    sec.innerHTML = `<h3><span class="lbl">${label}</span> <small class="count"></small>
        <select class="sf-sort hctl" aria-label="${label}排序"><option value="" hidden>排序</option>
          ${SORTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
        <button type="button" class="sf-open hctl">篩選</button>
        <button type="button" class="sf-reset hctl">清除篩選</button>
        <button type="button" class="unpick" hidden>取消選擇</button></h3>
      <div class="side-body"></div>`;
    sec.querySelector(".sf-sort").addEventListener("change", (e) => {
      const [key, dir] = e.target.value.split(":");
      sides[k].sort = { key, dir: +dir };
      sides[k].shown = PAGE;
      renderSides();
    });
    sec.querySelector(".sf-open").addEventListener("click", () => openFilters(k));
    sec.querySelector(".sf-reset").addEventListener("click", () => resetSide(k));
    sec.querySelector(".unpick").addEventListener("click", unpick);
  });

  // 有點選時：另一邊的一班和配得到的點選航班的來回總額（並列最低價時總額相同，天數可能不同）
  const between = (a, b) => Math.round(Math.abs(Date.parse(b) - Date.parse(a)) / 864e5) + 1;  // 含去程當天
  function pairInfo({ l, f, withs }) {
    const mates = withs.map((p) => picked.items[p]);
    return {
      days: uniq(mates.map((m) => between(m.l.date, l.date))).sort((a, b) => a - b),
      total: f.price + Math.min(...mates.map((m) => m.f.price)),
      label: picked.out ? `${md(mates[0].l.date)} → ${md(l.date)}` : `${md(l.date)} → ${md(mates[0].l.date)}`,
    };
  }
  function renderTotal(partners) {
    const el = $("side-total");
    el.hidden = !picked;
    $("split").classList.toggle("picked", !!picked);
    if (!picked) { el.innerHTML = ""; return; }
    const pairs = partners.map(pairInfo);
    const body = pairs.map((p) => `<tr>
      <td class="nw num">${p.days.join("、")} 天</td><td class="price num">${money(p.total)}</td>
    </tr>`).join("");
    const cards = pairs.map((p) => `<div class="card">
      <div class="row1"><b>${p.label}（${p.days.join("、")} 天）</b><span class="price num">${money(p.total)}</span></div>
    </div>`).join("");
    el.innerHTML = `<h3>總額 <small>${num(pairs.length)} 組</small></h3>
      ${pairs.length ? `<div class="table-wrap"><table><thead><tr><th>天數</th><th>總額</th></tr></thead>
        <tbody>${body}</tbody></table></div><div class="cards">${cards}</div>` : `<div class="empty">沒有可配對的航班</div>`}`;
  }
  let partnerRows = [];  // 另一邊目前顯示的航班（含配對的點選航班），畫連結線用
  function renderSides() {
    const outRows = renderSide(true), backRows = renderSide(false);
    partnerRows = picked ? (picked.out ? backRows : outRows) : [];
    renderTotal(partnerRows);
    drawLinks();
  }

  // 連結線：點選的航班 ↔ 另一邊配得到的每一班；回程 ↔ 來回總額的同一組（只在三欄並排的寬螢幕畫）
  function drawLinks() {
    const svg = $("links");
    svg.innerHTML = "";
    if (!picked || !matchMedia("(min-width: 1100px)").matches) return;
    const rowsOf = (id) => [...document.querySelectorAll(`#${id} tbody tr`)];
    const outRows = rowsOf("side-out"), backRows = rowsOf("side-back"), totalRows = rowsOf("side-total");
    const partners = picked.out ? backRows : outRows;
    const selRows = picked.out ? outRows : backRows;
    // 來回總額每一列和對應的航班列一樣高，連結線才會是水平的
    totalRows.forEach((tr, i) => { if (partners[i]) tr.style.height = `${partners[i].getBoundingClientRect().height}px`; });
    const box = $("split").getBoundingClientRect();
    // 表格太寬會在框內捲動，所以用外框（看得到的邊）當連結線的端點
    const edge = (tr, right) => {
      const b = tr.getBoundingClientRect();
      const w = tr.closest(".table-wrap").getBoundingClientRect();
      return [(right ? Math.min(b.right, w.right) : Math.max(b.left, w.left)) - box.left, b.top + b.height / 2 - box.top];
    };
    // 深淺模式都看得清楚的 10 個顏色，超過就循環使用
    const COLORS = ["#3b6fe0", "#e8710a", "#1e9e5a", "#c2255c", "#7048e8", "#0c8599", "#b08900", "#d63333", "#8d5a2b", "#5c7cfa"];
    const link = (a, b, i) => {
      const [x1, y1] = edge(a, true), [x2, y2] = edge(b, false);
      const mx = (x1 + x2) / 2;
      return `<g style="color:${COLORS[i % COLORS.length]}"><path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`
        + `<circle cx="${x1}" cy="${y1}" r="2.5"/><circle cx="${x2}" cy="${y2}" r="2.5"/></g>`;
    };
    let html = "";
    partnerRows.forEach(({ withs }, i) => {
      const tr = partners[i];
      if (!tr) return;
      withs.forEach((p) => {
        if (!selRows[p]) return;
        // 去程永遠在左邊：點選去程時從點選的列連到回程，點選回程時從去程連到點選的列
        html += picked.out ? link(selRows[p], tr, i) : link(tr, selRows[p], i);
        if (!picked.out && totalRows[i]) html += link(selRows[p], totalRows[i], i);
      });
      if (picked.out && totalRows[i]) html += link(tr, totalRows[i], i);
    });
    svg.innerHTML = html;
  }
  addEventListener("resize", drawLinks);

  // ---------- 每週最低單程價格：一組機場，去程、回程各一張折線圖 ----------
  let chartIdx = 0;  // 沒有篩選機場時，左右按鈕切換的那一組
  const chartPair = () => state.pair || pairs[chartIdx] || "";
  // 某個方向、某一週的最低價航班（跟著那一邊的直飛／轉機篩選）；並列最低價的都算
  function weekLows(o, d, w, stops) {
    let min = Infinity, items = [];
    const seen = new Set();
    LEGS.forEach((l) => {
      if (l.o !== o || l.d !== d || l.week !== w) return;
      l.flights.forEach((f) => {
        if (!stopsOk(stops, f) || f.price > min) return;
        if (f.price < min) { min = f.price; items = []; seen.clear(); }
        const key = rowKey(l, f);
        if (!seen.has(key)) { seen.add(key); items.push({ l, f }); }
      });
    });
    return items.length ? { price: min, items } : null;
  }
  function renderChart() {
    $("chart-nav").hidden = !!state.pair || pairs.length < 2;
    const pair = chartPair();
    const empty = (msg) => { $("chart-nav").hidden = true; $("chart-out").innerHTML = `<div class="muted">${msg}</div>`; $("chart-back").innerHTML = ""; $("chart-back").hidden = true; };
    if (!pair || !weeks.length) return empty("還沒有資料");
    const [tw, jp] = pair.split("|");
    $("chart-which").textContent = `${tw} ⇄ ${jp}`;
    const series = [
      { key: "out", out: true, name: `去程 ${tw}→${jp}`, o: tw, d: jp },
      { key: "back", out: false, name: `回程 ${jp}→${tw}`, o: jp, d: tw },
    ].map((x) => ({ ...x, lows: Object.fromEntries(weeks.map((w) => [w, weekLows(x.o, x.d, w, fOf(x.out).stops)]).filter(([, v]) => v)) }));
    const values = series.flatMap((x) => Object.values(x.lows).map((v) => v.price));
    if (!values.length) return empty("這組機場沒有符合的航班");
    $("chart-back").hidden = false;

    // 兩張圖用同一個價格刻度，上下才能直接比較
    let lo = Math.min(...values), hi = Math.max(...values);
    const step = Math.max(500, Math.ceil((hi - lo) / 3 / 500) * 500);
    lo = Math.floor(lo / step) * step - step / 2;
    hi = Math.ceil(hi / step) * step + step / 2;
    const sel = picked ? pickedKeys() : new Set();
    series.forEach((sr) => {
      const el = $(`chart-${sr.key}`);
      const W = Math.max(el.clientWidth - 28, 320), H = 170;
      const pad = { l: 56, r: 24, t: 32, b: 26 };
      const inset = 36;  // 第一週和最後一週離座標軸留空，標價才不會壓到刻度
      const gap = weeks.length === 1 ? Infinity : (W - pad.l - pad.r - inset * 2) / (weeks.length - 1);
      const x = (i) => pad.l + inset + (weeks.length === 1 ? (W - pad.l - pad.r - inset * 2) / 2 : i * gap);
      // 太擠時日期刻度隔幾週標一個；標價只標這條線的最低價
      const every = Math.ceil(44 / gap);
      const allVals = gap >= 46;
      const seriesMin = Math.min(...Object.values(sr.lows).map((v) => v.price));
      const y = (v) => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
      let svg = "";
      // 月份底色：每週算在週四所在的月份，色塊從前後兩週的中點切開
      const bands = [];
      weeks.forEach((w, i) => {
        const m = addDays(w, 3).slice(0, 7);
        if (bands.length && bands[bands.length - 1].m === m) bands[bands.length - 1].last = i;
        else bands.push({ m, first: i, last: i });
      });
      const half = weeks.length === 1 ? (W - pad.l - pad.r) / 2 : gap / 2;
      bands.forEach((b, k) => {
        const x1 = Math.max(pad.l, x(b.first) - half), x2 = Math.min(W - pad.r, x(b.last) + half);
        svg += `<rect class="band${k % 2}" x="${x1}" y="${pad.t - 22}" width="${x2 - x1}" height="${H - pad.b - pad.t + 22}" rx="4"/>`
          + `<text class="band-label" x="${x1 + 8}" y="${pad.t - 8}">${+b.m.slice(5)} 月</text>`;
      });
      for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
        svg += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/>`
          + `<text class="tick" x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
      }
      weeks.forEach((w, i) => {
        if (i % every) return;
        const year = i === 0 || w.slice(0, 4) !== weeks[i - every].slice(0, 4);
        svg += `<text class="tick" x="${x(i)}" y="${H - 6}" text-anchor="middle">${md(w)}${year ? ` ${w.slice(0, 4)}` : ""}</text>`;
      });
      let d = "", prev = false, marks = "";
      weeks.forEach((w, i) => {
        const v = sr.lows[w];
        if (!v) { prev = false; return; }  // 沒有資料的週斷開
        d += `${prev ? "L" : "M"}${x(i)},${y(v.price)} `;
        prev = true;
        const on = picked && picked.out === sr.out && v.items.every(({ l, f }) => sel.has(rowKey(l, f)));
        const dates = uniq(v.items.map(({ l }) => md(l.date))).join("、");
        marks += `<g data-w="${w}"><title>${esc(sr.name)}　${md(w)}–${md(addDays(w, 6))} 當週　${money(v.price)}（${dates}，${v.items.length} 班）</title>`
          + `<circle class="hit" cx="${x(i)}" cy="${y(v.price)}" r="14"/>`
          + `<circle class="dot${on ? " on" : ""}" cx="${x(i)}" cy="${y(v.price)}" r="4.5"/>`
          + (allVals || v.price === seriesMin ? `<text class="val" x="${x(i)}" y="${y(v.price) - 10}" text-anchor="middle">${num(v.price)}</text>` : "")
          + `</g>`;
      });
      svg += `<g class="series ${sr.key}"><path d="${d}"/>${marks}</g>`;
      el.innerHTML = `<div class="title"><i style="background:var(--series-${sr.key})"></i>${esc(sr.name)}</div>
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(sr.name)} 每週最低單程價格">${svg}</svg>`;
      // 點一個點：選取那一週所有並列最低價的航班，表格直接走點選的流程
      el.querySelectorAll("g[data-w]").forEach((g) => g.addEventListener("click", () => {
        picked = { out: sr.out, items: sr.lows[g.dataset.w].items };
        sides.out.shown = PAGE;
        sides.back.shown = PAGE;
        setView(!sr.out, false);  // 下面會捲到篩選列
        setPage("flights");
        renderSides();
        renderChart();
        document.querySelector(".filters").scrollIntoView({ behavior: "smooth", block: "start" });
      }));
    });
  }
  $("chart-prev").addEventListener("click", () => { chartIdx = (chartIdx - 1 + pairs.length) % pairs.length; renderChart(); });
  $("chart-next").addEventListener("click", () => { chartIdx = (chartIdx + 1) % pairs.length; renderChart(); });
  addEventListener("resize", renderChart);

  // ---------- 更新 ----------
  function update() {
    if (state.pair && !pairs.includes(state.pair)) state.pair = "";
    store.set("filters", state);
    refreshPairs();
    renderRange();
    sides.out.shown = PAGE;
    sides.back.shown = PAGE;
    renderSides();  // 點選的航班保持選取
    renderChart();
  }
  update();
})();
</script>
</body>
</html>
