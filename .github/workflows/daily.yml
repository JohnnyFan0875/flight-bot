name: daily

on:
  schedule:
    - cron: "0 19 * * *" # 台灣時間 03:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印出結果，不發送 Discord、不上傳 R2、不更新報告網頁"
        type: boolean
        default: false

concurrency:
  group: flight-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: flight-bot daily
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'flight-bot' }}
        run: uv run flight-bot run --mode daily ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: upload report
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 每日報告網頁（需要在 repo 的 Settings → Pages 把 Source 設成 GitHub Actions）
  deploy-report:
    needs: run
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
