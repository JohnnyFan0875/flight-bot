runner:
  concurrency: 2
  delay_seconds: [2, 5]      # 每次查詢後隨機等待的秒數範圍
  retries: 2
  abort_after_consecutive_failures: 20

alerts:
  max_price: null            # 先不設；之後可改成 {default: N, by_month: {12: N, ...}}
  use_google_price_level: true
  below_median_pct: 15
  notify_new_low: true
  warmup_days: 7

report:
  url: https://johnnyfan0875.github.io/flight-bot/   # 每日報告網址（GitHub Pages）
  keep_days: 30              # 網站上保留幾天的歷史報告

weekly_summary:
  enabled: true
  weekday: 0                 # 週一
  hour: 9                    # 台灣時間

health:
  max_failure_rate: 0.30
  max_days_without_success: 3

destinations:
  - name: example           # 顯示名稱，也是歷史價格的單位（改名會重新累積）；不寫就用目的地名稱
    enabled: false           # true = 查詢；false = 暫停，設定和歷史資料都保留
    origins: [TPE]           # 出發地（台灣端機場），可多個，例如 [TPE, TSA]
    dests: [LHR]             # 目的地，可多個，例如 [NRT, HND]
    query_start: 2026-12-01  # 去程出發日範圍的第一天（今天以前的日期自動略過）
    query_end: 2027-02-28    # 去程出發日範圍的最後一天；範圍內每天都查
                             # 回程查 query_start + trip_days 最短天數 到 query_end + 最長天數
    trip_days: [10, 12, 14]  # 網頁上配對去回程用的天數（去程日 + N 天）
    max_stops: 1             # 最多轉機次數，0 = 只要直飛
    max_total_duration_h: 24 # 單程總時間上限（小時，含轉機等待）；null = 不限
    max_layover_h: 6         # 每次轉機最長等多久（小時）；null = 不限
    min_layover_min: 75      # 每次轉機最少要有多久（分鐘），太短怕趕不上；null = 不限

  - name: 北海道
    enabled: true
    origins: [TPE]
    dests: [CTS]
    query_start: 2026-12-01
    query_end: 2027-02-28
    trip_days: [5, 6, 7]
    max_stops: 0
    max_total_duration_h: null
    max_layover_h: null
    min_layover_min: null

  - name: 仙台
    enabled: true
    origins: [TPE]
    dests: [SDJ]
    query_start: 2026-12-01
    query_end: 2027-02-28
    trip_days: [5, 6, 7]
    max_stops: 0
    max_total_duration_h: null
    max_layover_h: null
    min_layover_min: null

  - name: 東京
    enabled: true
    origins: [TPE]
    dests: [NRT, HND]
    query_start: 2026-12-01
    query_end: 2027-02-28
    trip_days: [5, 6, 7]
    max_stops: 0
    max_total_duration_h: null
    max_layover_h: null
    min_layover_min: null

  - name: 東京羽田（含松山）
    enabled: true
    origins: [TPE, TSA]
    dests: [HND]
    query_start: 2026-12-01
    query_end: 2027-02-28
    trip_days: [5, 6, 7]
    max_stops: 0
    max_total_duration_h: null
    max_layover_h: null
    min_layover_min: null

  - name: 福岡
    enabled: true
    origins: [TPE]
    dests: [FUK]
    query_start: 2027-03-01
    query_end: 2027-05-31
    trip_days: [5]
    max_stops: 0
    max_total_duration_h: null
    max_layover_h: null
    min_layover_min: null